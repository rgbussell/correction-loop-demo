[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "correction-loop-demo"
version = "0.1.0"
description = "A continual-learning loop that learns from correction deltas — and can be seen refusing a bad round. Open spine-CT demo."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "nibabel>=5.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
train = ["torch>=2.2", "monai>=1.3", "mlflow>=2.10"]
dev = ["pytest>=7.4", "ruff>=0.5"]
dvc = ["dvc[gdrive]>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
